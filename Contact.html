<!doctype html>
<html>
<head>
    <title> TLC - About Me </title> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            text-align: center;
            color: #f2f2f2;

            margin-top: 80px; 
            margin-bottom: 80px;
            padding-left: 20px;
            padding-right: 20px;
            
            overflow-x: hidden;

            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('BG.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #121212;

            font-family: 'Inter', sans-serif;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-wrapper {
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 1.2s ease-out forwards;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 52px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 30px;
            letter-spacing: 1.5px;
            color: #d1d1d1;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
        }

        .profile-img {
            max-width: 100%;
            height: auto;
            width: 350px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
        }

        /* Bio Description Text */
        .bio-text {
            font-size: 18px;
            line-height: 1.6;
            color: #e0e0e0;
            max-width: 650px;
            margin: 0 auto 35px auto;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        }

        /* Contact Action Buttons Container */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .action-btn {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 1px;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid #ffffff;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        .navigation {
            margin-top: 20px;
        }

        .nav-btn {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            padding: 12px 28px;
            border-radius: 4px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
            margin-bottom: 16px;
            min-width: 240px;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .nav-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            body {
                margin-top: 40px;
                background-attachment: scroll;
            }

            h1 { font-size: 36px; }
            h2 { font-size: 22px; }
            .profile-img { width: 80%; }
            .bio-text { font-size: 16px; }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .action-btn {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="content-wrapper">

        <h1> About me </h1>
        <h2> Emanuel Tuscher </h2>

        <!-- Profile Image -->
        <img src="Con1.jpeg" alt="Emanuel Tuscher" class="profile-img">

        <!-- Bio Paragraph -->
        <p class="bio-text">
            Hi, I'm Emanuel and I'm 16 years old. I have made this website just out of fun. I do various of things. I hope you enjoy my work and if any mistakes on the websites are found then immediately tell me on my Contact down here.
        </p>

        <!-- Interactive Contact Buttons -->
        <div class="action-buttons">
            <button class="action-btn" id="copyBtn" onclick="copyUsername()">Copy Discord Username</button>
            <a href="https://discord.gg/UCYVgytPF" target="_blank" class="action-btn">Discord Server</a>
        </div>

        <!-- Return to Homepage Navigation -->
        <div class="navigation">
            <a href="index.html" class="nav-btn">&#8592; Back to Homepage</a>
        </div>

    </div>

    <script>
        function copyUsername() {
            navigator.clipboard.writeText('knockedguy').then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = 'Copied "knockedguy"!';
                btn.style.borderColor = '#4CAF50';
                
                setTimeout(() => {
                    btn.textContent = 'Copy Discord Username';
                    btn.style.borderColor = '#ffffff';
                }, 2500);
            });
        }
    </script>

</body>
</html>
