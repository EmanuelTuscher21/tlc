<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TLC - Chapter</title> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Fonts: Cinzel for headings, Inter for clean readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            text-align: center;
            color: #f2f2f2;
            margin-top: 100px; 
            margin-bottom: 100px;
            padding-left: 20px;
            padding-right: 20px;
            overflow-x: hidden;

            /* Visual Identity: Dark charcoal background with atmospheric overlay and crimson accent hints */
            background-image: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('C1.jpg'); /* Change to C1.jpg - C6.png per chapter */
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #121212;

            /* Typography: Clean readable body font */
            font-family: 'Inter', sans-serif;
        }

        .content-wrapper {
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Distinctive Headings using Cinzel */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 46px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 0 10px rgba(139, 0, 0, 0.3); /* Subtle crimson glow hint */
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            letter-spacing: 1.5px;
            color: #d1d1d1;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* Typography & Spacing: Improved line-height and generous paragraph margins */
        p {
            font-size: 19px;
            line-height: 1.9; /* Enhanced line height */
            letter-spacing: 0.5px;
            color: #e0e0e0;
            margin-bottom: 35px; /* Increased spacing between paragraphs */
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
            text-align: left;
        }

        /* Consistent Button & Border Identity with Crimson Accents */
        .heart-container {
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .heart-btn {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 12px 28px;
            font-size: 18px;
            cursor: pointer;
            color: #ffffff;
            font-family: 'Cinzel', serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            user-select: none;
            min-width: 170px;
        }

        .heart-btn:hover:not(:disabled) {
            transform: scale(1.06);
            border-color: #8b0000; /* Crimson accent border on hover */
            background: rgba(139, 0, 0, 0.15);
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.4);
        }

        .heart-btn.liked {
            border-color: #ff4d4d;
            background: rgba(255, 77, 77, 0.2);
            box-shadow: 0 0 18px rgba(255, 77, 77, 0.5);
        }

        /* Consistent Navigation Styling */
        .navigation {
            margin-top: 40px;
        }

        .nav-btn {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(20, 20, 20, 0.6);
            padding: 12px 28px;
            border-radius: 4px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
            margin-bottom: 16px;
            min-width: 240px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            color: #ffffff;
            border-color: #8b0000; /* Crimson accent */
            background: rgba(139, 0, 0, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.4);
        }

        .next-btn {
            background-color: rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 768px) {
            body { margin-top: 50px; background-attachment: scroll; }
            h1 { font-size: 30px; }
            h2 { font-size: 18px; margin-bottom: 30px; }
            p { font-size: 16px; line-height: 1.7; margin-bottom: 24px; }
            .nav-btn { font-size: 16px; padding: 10px 20px; min-width: 200px; }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>The Last Consequence: Birth of the Dark Spiral</h1>
        <h2>Chapter Title Here</h2>
        
        <p>Your chapter paragraphs go here with enhanced line spacing and readability...</p>

        <div class="heart-container">
            <button class="heart-btn" id="likeBtn" disabled>
                <span class="heart-icon" id="heartIcon">🤍</span> 
                <span>Like</span>
                <span class="like-count" id="likeCount">(0)</span>
            </button>
        </div>

        <div class="navigation">
            <a href="index.html" class="nav-btn">Back to Homepage</a>
        </div>
    </div>
</body>
</html>
